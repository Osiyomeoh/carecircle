<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <style>
      .box{rx:12;stroke-width:2}
      .t{fill:#1f2733;font-size:15px;font-weight:600}
      .s{fill:#5b6472;font-size:12px}
      .lbl{fill:#8a93a2;font-size:12px;font-weight:700;letter-spacing:.08em}
      .aws{fill:#fff5ec;stroke:#ff9900}
      .mcp{fill:#eef4ff;stroke:#3b82f6}
      .eng{fill:#eafaf1;stroke:#22a45d}
      .sig{fill:#f4f6f9;stroke:#c3cad6}
      .ready{fill:#f8f9fb;stroke:#c3cad6;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="40" y="46" fill="#1f2733" font-size="24" font-weight="700">CareCircle - Alexa+ MCP architecture</text>
  <text x="40" y="70" class="s">Events → Obligations → Ownership · a signal is evidence, never a conclusion</text>

  <!-- SIGNALS column -->
  <text x="60" y="116" class="lbl">SIGNALS</text>
  <g>
    <rect class="box sig" x="40" y="128" width="180" height="52"/>
    <text x="60" y="150" class="t">Alexa+ voice</text><text x="60" y="168" class="s">spoken care events</text>
    <rect class="box sig" x="40" y="192" width="180" height="52"/>
    <text x="60" y="214" class="t">Ring doorbell</text><text x="60" y="232" class="s">delivery · presence</text>
    <rect class="box ready" x="40" y="256" width="180" height="52"/>
    <text x="60" y="278" class="t">Bee wearable</text><text x="60" y="296" class="s">adapter-ready</text>
    <rect class="box ready" x="40" y="320" width="180" height="52"/>
    <text x="60" y="342" class="t">Fire TV board</text><text x="60" y="360" class="s">adapter-ready</text>
  </g>

  <!-- PLANNER -->
  <text x="290" y="116" class="lbl">PLANNER</text>
  <rect class="box aws" x="270" y="192" width="200" height="116"/>
  <text x="290" y="224" class="t">Alexa+ planner</text>
  <text x="290" y="246" class="s">Amazon Bedrock</text>
  <text x="290" y="264" class="s">Claude Sonnet 4.5</text>
  <text x="290" y="290" class="s" font-weight="700" fill="#ff9900">93.3% tool accuracy</text>

  <!-- MCP SERVER -->
  <text x="540" y="116" class="lbl">MCP SERVER</text>
  <rect class="box mcp" x="520" y="128" width="230" height="150"/>
  <text x="540" y="158" class="t">CareCircle MCP</text>
  <text x="540" y="178" class="s">Streamable HTTP · 2025-11-25</text>
  <text x="540" y="196" class="s">14 tools · session identity</text>
  <line x1="540" y1="210" x2="730" y2="210" stroke="#d6def0"/>
  <text x="540" y="232" class="s">AWS App Runner (HTTPS)</text>
  <text x="540" y="250" class="s">← ECR ← CodeBuild</text>
  <text x="540" y="268" class="s" font-weight="700" fill="#3b82f6">purchase-in-place</text>

  <!-- ENGINE -->
  <rect class="box eng" x="520" y="300" width="230" height="96"/>
  <text x="540" y="330" class="t">Care engine</text>
  <text x="540" y="352" class="s">Events → Obligations → Ownership</text>
  <text x="540" y="374" class="s" font-weight="700" fill="#22a45d">Known ≠ Assumed</text>

  <!-- DATA / DELIVERY -->
  <text x="820" y="116" class="lbl">AWS SERVICES</text>
  <rect class="box aws" x="800" y="128" width="200" height="52"/>
  <text x="820" y="150" class="t">DynamoDB</text><text x="820" y="168" class="s">care record · single-table</text>
  <rect class="box aws" x="800" y="192" width="200" height="52"/>
  <text x="820" y="214" class="t">Amazon SNS</text><text x="820" y="232" class="s">notify a member</text>
  <rect class="box aws" x="800" y="300" width="200" height="52"/>
  <text x="820" y="322" class="t">CloudWatch</text><text x="820" y="340" class="s">observability · budget alarm</text>

  <!-- arrows -->
  <path d="M220 204 H262" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M220 250 C245 250 245 250 262 236" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M470 236 C495 236 495 210 512 203" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M635 278 V294" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M750 200 H792" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M750 220 C775 220 780 218 792 218" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M750 348 C775 340 780 330 792 326" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arw)"/>

  <!-- legend -->
  <g transform="translate(40,470)">
    <rect class="box mcp" x="0" y="0" width="16" height="16"/><text x="24" y="13" class="s">MCP</text>
    <rect class="box aws" x="80" y="0" width="16" height="16"/><text x="104" y="13" class="s">AWS service</text>
    <rect class="box eng" x="210" y="0" width="16" height="16"/><text x="234" y="13" class="s">Care engine</text>
    <rect class="box ready" x="330" y="0" width="16" height="16"/><text x="354" y="13" class="s">architecturally ready (not live)</text>
  </g>
  <text x="40" y="540" class="s">Simulated Alexa+ web client → MCP over Streamable HTTP → deterministic engine → AWS data, delivery &amp; observability.</text>
</svg>
